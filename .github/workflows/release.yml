name: Release

# Push a tag that matches the version in mygo.json (v0.1.0 for "0.1.0") to
# build a signed, notarized universal DMG and draft a GitHub Release with it.
# Run it by hand to get the DMG as a workflow artifact without a release.
#
# Secrets:
#   BUILD_CERTIFICATE_BASE64  base64 of the Developer ID Application .p12
#   P12_PASSWORD              the .p12's password
#   KEYCHAIN_PASSWORD         any string, for the temporary keychain
#   SIGN_ID                   "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                  Apple ID email
#   APPLE_TEAM_ID             10-character team ID
#   NOTARIZE_PASSWORD         app-specific password from appleid.apple.com

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version mygo.json)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION in mygo.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      # The certificate and the notary credentials go into a temporary
      # keychain, made the default so codesign and notarytool both find them.
      # mygo.json names the credentials' profile, AGENT_KANBAN_NOTARY.
      - name: Import signing certificate and notary credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN"
          xcrun notarytool store-credentials AGENT_KANBAN_NOTARY \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$NOTARIZE_PASSWORD"

      - name: Build, sign and notarize
        env:
          SIGN_ID: ${{ secrets.SIGN_ID }}
        run: go run github.com/egoist/mygo/cmd/mygo build -platform darwin/universal -sign "$SIGN_ID"

      - name: Verify
        run: |
          set -euo pipefail
          DMG="build/darwin-universal/agent-kanban-${{ steps.version.outputs.version }}.dmg"
          codesign --verify --deep --strict "build/darwin-universal/Agent Kanban.app"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-kanban-${{ steps.version.outputs.version }}
          path: build/darwin-universal/*.dmg

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            --title "Agent Kanban ${{ steps.version.outputs.version }}" \
            "build/darwin-universal/agent-kanban-${{ steps.version.outputs.version }}.dmg"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
